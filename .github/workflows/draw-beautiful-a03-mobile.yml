name: Draw Beautiful A03 mobile engraving QA
on:
  push:
    branches:
      - experiment/a03-mobile-hatch-profile
    paths:
      - experiments/rare-earth-cascade-a03-open/**
      - experiments/rare-earth-cascade-a06/scene.mjs
      - .github/workflows/draw-beautiful-a03-mobile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mobile-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install preview utilities
        run: python -m pip install --quiet pillow cairosvg
      - name: Verify original and mobile profile geometry
        run: |
          node --test experiments/rare-earth-cascade-a06/scene.test.mjs
          node --test experiments/rare-earth-cascade-a03-open/scene.test.mjs
          node --test experiments/rare-earth-cascade-a03-open/mobile-hatch.test.mjs
      - name: Render unchanged master and mobile profile
        run: node experiments/rare-earth-cascade-a03-open/build-mobile.mjs
      - name: Compare actual 390px and 960px rasterizations
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw
          import cairosvg,json,hashlib,xml.etree.ElementTree as ET
          root=Path('experiments/rare-earth-cascade-a03-open/renders')
          report=json.loads((root/'mobile-hatch-report.json').read_text())
          assert len(report['files'])==2
          originals=[]
          for entry in report['files']:
              file=root/entry['name']
              raw=file.read_bytes()
              assert not any(x in raw.lower() for x in (b'<image',b'data:image',b'<script'))
              tree=ET.fromstring(raw)
              paths=tree.findall('.//{http://www.w3.org/2000/svg}path')
              assert len(paths)>=80
              entry['sha256']=hashlib.sha256(raw).hexdigest()
              entry['layers']=len(paths)
              originals.append(entry['sha256'])
              for width in (390,960):
                  png=file.with_name(file.stem+'-'+str(width)+'px.png')
                  cairosvg.svg2png(bytestring=raw,write_to=str(png),output_width=width)
                  img=Image.open(png).convert('RGB')
                  assert img.size==(width,round(width*2/3))
                  print('PASS',entry['profile'],width,img.size,entry['layers'],'vector layers')
          assert originals[0]!=originals[1]
          sheets=[]
          for width in (390,960):
              panels=[]
              for entry in report['files']:
                  src=root/(Path(entry['name']).stem+'-'+str(width)+'px.png')
                  im=Image.open(src).convert('RGB')
                  im.thumbnail((width,width*2//3))
                  panels.append(im)
              strip=Image.new('RGB',(width*2,width*2//3),(243,235,221))
              strip.paste(panels[0],(0,0))
              strip.paste(panels[1],(width,0))
              strip.save(root/('comparison-'+str(width)+'px.png'))
          (root/'mobile-hatch-report.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Upload real vector and raster comparisons
        uses: actions/upload-artifact@v4
        with:
          name: a03-physical-intaglio-mobile-comparison
          path: experiments/rare-earth-cascade-a03-open/renders/
      - name: Preserve experimental outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/rare-earth-cascade-a03-open/renders/
          if ! git diff --cached --quiet; then
            git commit -m "experiment: store original and compact physical hatch comparisons [skip ci]"
            git push
          fi
