name: Draw Beautiful A03 candidate plate QA
on:
  push:
    branches:
      - experiment/a03-spatial-plate-qa
    paths:
      - experiments/rare-earth-cascade-a03-open/**
      - experiments/rare-earth-cascade-a06/scene.mjs
      - experiments/rare-earth-cascade-a06/vendor/**
      - .github/workflows/draw-beautiful-a03-plate-qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plate-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SVG QA render dependencies
        run: python -m pip install --quiet cairosvg pillow
      - name: Verify baseline original 3D geometry and engraving
        run: |
          node --test experiments/rare-earth-cascade-a06/scene.test.mjs
          node --test experiments/rare-earth-cascade-a03-open/scene.test.mjs
      - name: Verify candidate vector, camera, reproducibility and 390/960/1920-px views
        run: python experiments/rare-earth-cascade-a03-open/plate_qa.py --check
      - name: Archive actual Draw Beautiful candidate and multi-size previews
        uses: actions/upload-artifact@v4
        with:
          name: a03-open-settler-candidate-technical-qa
          path: experiments/rare-earth-cascade-a03-open/renders/
          if-no-files-found: error
      - name: Preserve QA report and renders in the experiment branch
        if: github.ref == 'refs/heads/experiment/a03-spatial-plate-qa'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/rare-earth-cascade-a03-open/renders/
          if ! git diff --cached --quiet; then
            git commit -m "experiment: A03 candidate rendering and multi-size QA [skip ci]"
            git push
          fi
