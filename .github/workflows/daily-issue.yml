name: Daily WSB issue preparation

on:
  schedule:
    # 07:00 Kyiv: UTC+3 during DST, UTC+2 otherwise.
    # Both UTC triggers run; local-date eligibility and a persistent branch claim deduplicate.
    - cron: '0 4,5 * * *'
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'Backfill issue date (YYYY-MM-DD, Europe/Kyiv). Leave empty for today.'
        required: false
        type: string
        default: ''
      retry_existing:
        description: 'Retry already-claimed Kyiv date after diagnosing a failed run'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: daily-wsb-preparation-${{ github.event_name == 'workflow_dispatch' && inputs.issue_date || github.event_name == 'workflow_dispatch' && 'manual-today' || 'scheduled' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Daily preparation gate
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Kyiv date and eligibility
        id: kyiv
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_DATE: ${{ inputs.issue_date }}
        run: |
          hour="$(TZ=Europe/Kyiv date +%H)"
          today="$(TZ=Europe/Kyiv date +%F)"
          date="$today"
          if [ -n "$REQUESTED_DATE" ]; then
            if [ "$EVENT_NAME" != "workflow_dispatch" ] || [[ ! "$REQUESTED_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! date -d "$REQUESTED_DATE" "+%F" | grep -qx "$REQUESTED_DATE"; then
              echo "::error::Invalid manual backfill date (expected YYYY-MM-DD)."
              exit 1
            fi
            if [[ "$REQUESTED_DATE" > "$today" ]]; then
              echo "::error::Cannot prepare future issue date."
              exit 1
            fi
            date="$REQUESTED_DATE"
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "schedule" ] && [ "$((10#$hour))" -lt 7 ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Skip: Kyiv local time is $hour, before 07."
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi


      - name: Claim one preparation attempt per Kyiv date
        if: steps.kyiv.outputs.eligible == 'true'
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_DATE: ${{ steps.kyiv.outputs.date }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RETRY_EXISTING: ${{ inputs.retry_existing }}
        run: |
          branch="automation/daily/${ISSUE_DATE}"
          if gh api "repos/$REPO/git/ref/heads/$branch" --jq '.ref' > /dev/null 2>&1; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$RETRY_EXISTING" = "true" ]; then
              echo "claimed=true" >> "$GITHUB_OUTPUT"
              echo "Manual recovery accepted for existing $branch."
            else
              echo "claimed=false" >> "$GITHUB_OUTPUT"
              echo "Skip: $branch already exists. To recover, manually dispatch with retry_existing=true."
            fi
            exit 0
          fi
          if gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/heads/$branch" -f "sha=$HEAD_SHA" > /dev/null; then
            echo "claimed=true" >> "$GITHUB_OUTPUT"
            echo "Claimed $branch for the daily issue."
          else
            echo "::error::Could not persist the daily preparation claim; refusing duplicate execution."
            exit 1
          fi

      - name: Checkout repository
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/checkout@v4

      - name: Configure Node.js
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check research executor configuration
        if: steps.claim.outputs.claimed == 'true'
        id: executor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENAI_API_KEY is unset; no autonomous research can run."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record missing executor as an actionable GitHub issue
        if: steps.claim.outputs.claimed == 'true' && steps.executor.outputs.configured != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_DATE: ${{ steps.kyiv.outputs.date }}
        run: |
          title="WSB automation blocked: research executor not configured"
          existing="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json title --jq '.[] | select(.title == "WSB automation blocked: research executor not configured") | .title' | head -n1)"
          if [ -z "$existing" ]; then
            gh issue create --repo "$REPO" --title "$title" --body "Daily preparation ran on $ISSUE_DATE (Europe/Kyiv). No autonomous research executor has been configured. Configure OPENAI_API_KEY as a repository secret to enable research intake. Research packets are unverified and must never auto-publish. Publication remains blocked; do not invent an issue."
          fi

      - name: Research candidate changes
        if: steps.claim.outputs.claimed == 'true' && steps.executor.outputs.configured == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WSB_OPENAI_MODEL: ${{ vars.WSB_OPENAI_MODEL }}
          WSB_ISSUE_DATE: ${{ steps.kyiv.outputs.date }}
        run: node publisher/research-intake.js

      - name: Upload research packet for human verification
        if: steps.claim.outputs.claimed == 'true' && steps.executor.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wsb-research-${{ steps.kyiv.outputs.date }}
          path: research/pending/${{ steps.kyiv.outputs.date }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Create a review PR containing the unverified candidate packet
        if: steps.claim.outputs.claimed == 'true' && steps.executor.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_DATE: ${{ steps.kyiv.outputs.date }}
        run: |
          branch="automation/daily/$ISSUE_DATE"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          mkdir -p research/pending
          git add "research/pending/$ISSUE_DATE.json"
          git -c user.name="wsb-automation" -c user.email="actions@users.noreply.github.com" commit -m "Add unverified WSB research for $ISSUE_DATE"
          git push origin HEAD:"$branch"
          gh pr create --repo "$REPO" --head "$branch" --base main --draft \
            --title "Research intake: $ISSUE_DATE (verification required)" \
            --body "Unverified research candidates only. NO issue publication is authorized. Verify all source URLs, dates, and Δ classifications before producing a release."
