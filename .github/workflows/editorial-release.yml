name: Prepare approved WSB release PR
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'research/approvals/*.json'
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare:
    if: startsWith(github.event.pull_request.head.ref, 'editorial/approval-') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download editorial decisions and source draft from PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(gh api "repos/$REPO/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')"
          dates="$(printf '%s\n' "$files" | grep -E '^research/approvals/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' || true)"
          if [ "$(printf '%s\n' "$dates" | sed '/^$/d' | wc -l)" -ne 1 ]; then
            echo "::error::Exactly one approval file must be changed"
            exit 1
          fi
          if [ "$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)" -ne 1 ]; then
            echo "::error::Approval PR may contain only one decisions file"
            exit 1
          fi
          date="${dates##*/}"; date="${date%.json}"
          echo "WSB_DATE=$date" >> "$GITHUB_ENV"
          mkdir -p research/approvals
          gh api "repos/$REPO/contents/research/approvals/$date.json?ref=$HEAD_SHA" --jq .content | base64 -d > "research/approvals/$date.json"
          gh api "repos/$REPO/git/ref/heads/automation/daily/$date" --jq .object.sha > /dev/null
          for file in MANIFEST.json state.json evidence.json claims.json relations.json locale/en.json locale/ua.json read/en.md read/ua.md; do
            mkdir -p "research/drafts/$date/canonical/$(dirname "$file")"
            gh api "repos/$REPO/contents/research/drafts/$date/canonical/$file?ref=automation/daily/$date" --jq .content | base64 -d > "research/drafts/$date/canonical/$file"
          done
      - name: Build approved release files
        run: |
          set -euo pipefail
          node publisher/editorial-approval.js "$WSB_DATE"
          npm run build
      - name: Create release pull request without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          issue="$(node -p 'JSON.parse(require("fs").readFileSync("research/approvals/"+process.env.WSB_DATE+".json")).issue_id')"
          branch="editorial/release-$WSB_DATE"
          git config user.name "wsb-automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add "issues/${issue#WSB-}/"
          git commit -m "Prepare approved $issue for editorial release"
          git push origin "$branch"
          gh pr create --repo "$REPO" --head "$branch" --base main --draft --title "Release review: $issue ($WSB_DATE)" --body "Generated from explicitly signed-off decisions in PR #${{ github.event.pull_request.number }}. Full build passed. Final human review and merge required; no auto-publication."
