name: Validate WSB release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Full build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Syntax-check unattended research runner
        run: node --check publisher/research-intake.js
      - name: Validate, test and generate publication
        run: npm run build

      - name: Prepare Pages publication assets and paths
        run: |
          node publisher/self-host-fonts.js dist
          node publisher/pages-prefix.js dist /world-system-brief
      - name: Check generated site links and asset integrity
        run: node publisher/release-audit.js dist --strict
      - name: Set up Python for Chromium smoke tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser smoke tests against final prefixed Pages build
        run: python tests/browser_smoke.py
      - name: Capture bilingual editorial screenshots and measured overflow
        run: python tests/visual_capture.py
      - name: Upload visual QA screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsb-visual-qa-${{ github.sha }}
          path: artifacts/visual-qa/
          if-no-files-found: warn
          retention-days: 14
