name: Draw Beautiful A03 open settler
on:
  push:
    branches:
      - experiment/draw-beautiful-a03-open-settler
    paths:
      - experiments/rare-earth-cascade-a03-open/**
      - experiments/rare-earth-cascade-a06/scene.mjs
      - .github/workflows/draw-beautiful-a03-open.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test experiments/rare-earth-cascade-a03-open/scene.test.mjs
      - name: Genuine Draw Beautiful rendering
        run: node experiments/rare-earth-cascade-a03-open/build.mjs
      - name: Verify vectors and rasterize for visual inspection
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          from pathlib import Path
          import cairosvg,xml.etree.ElementTree as ET,io,base64
          from PIL import Image
          root=Path('experiments/rare-earth-cascade-a03-open/renders')
          for f in sorted(root.glob('*.svg')):
              xml=ET.fromstring(f.read_text())
              paths=xml.findall('.//{http://www.w3.org/2000/svg}path')
              assert len(paths)>30 and f.stat().st_size<5000000,(f,len(paths))
              assert not xml.findall('.//{http://www.w3.org/2000/svg}image')
              png=f.with_suffix('.png')
              cairosvg.svg2png(url=str(f),write_to=str(png),output_width=960)
              thumb=Image.open(png).convert('RGB')
              thumb.thumbnail((700,470))
              buf=io.BytesIO()
              thumb.save(buf,'JPEG',quality=83,optimize=True)
              (root/(f.stem+'.base64.txt')).write_text(base64.b64encode(buf.getvalue()).decode())
              print('PASS',f,len(paths),f.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: draw-beautiful-a03-open-settler
          path: experiments/rare-earth-cascade-a03-open/renders/
          if-no-files-found: error
      - name: Preserve experimental vectors on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/rare-earth-cascade-a03-open/renders/
          if ! git diff --cached --quiet; then
            git commit -m "experiment: Draw Beautiful open-settler physical renders [skip ci]"
            git push
          fi
